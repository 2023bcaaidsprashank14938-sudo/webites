
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Prashank Pandey | Login</title>
  <meta name="description" content="Welcome to Prashank Pandey's website.">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
        Roboto, Arial, sans-serif;
      background:
        radial-gradient(ellipse at top left, #312e81 0%, transparent 45%),
        radial-gradient(ellipse at bottom right, #581c87 0%, transparent 45%),
        #0b1020;
      color: #fff;
    }

    .login-box {
      width: 100%;
      max-width: 410px;
      padding: 42px 35px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.07);
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      text-align: center;
      animation: appear 0.6s ease-out;
    }

    .logo {
      width: 64px;
      height: 64px;
      margin: 0 auto 22px;
      display: flex;
      justify-content: center;
      align-items: center;
      border-radius: 20px;
      background: linear-gradient(135deg, #7c3aed, #4f46e5);
      box-shadow: 0 8px 28px rgba(99, 72, 220, 0.3);
      font-size: 25px;
      font-weight: 800;
      letter-spacing: -1px;
    }

    h1 {
      margin-bottom: 12px;
      font-size: clamp(25px, 5vw, 31px);
      font-weight: 750;
      letter-spacing: -1px;
      background: linear-gradient(90deg, #c4b5fd, #818cf8, #e9d5ff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .subtitle {
      margin-bottom: 30px;
      color: #b8c0d9;
      font-size: 15px;
      line-height: 1.6;
    }

    .field {
      margin-bottom: 16px;
      text-align: left;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #e0e7ff;
      font-size: 13px;
      font-weight: 600;
    }

    input[type="email"],
    input[type="password"] {
      display: block;
      width: 100%;
      padding: 15px 16px;
      border: 1px solid rgba(255, 255, 255, 0.13);
      border-radius: 12px;
      outline: none;
      background: rgba(8, 13, 30, 0.65);
      color: #fff;
      font-size: 15px;
      transition: border-color 0.25s, box-shadow 0.25s;
    }

    input::placeholder {
      color: #8992ae;
    }

    input:focus {
      border-color: #a78bfa;
      box-shadow: 0 0 0 4px rgba(139, 92, 246, 0.17);
    }

    .options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin: 4px 0 22px;
      color: #b8c0d9;
      font-size: 12px;
    }

    .remember {
      display: flex;
      align-items: center;
      gap: 7px;
      margin: 0;
      font-weight: 400;
    }

    .remember input {
      accent-color: #8b5cf6;
    }

    .options a,
    .signup a {
      color: #c4b5fd;
      text-decoration: none;
    }

    .options a:hover,
    .signup a:hover {
      text-decoration: underline;
    }

    button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(100deg, #7c3aed, #4f46e5);
      color: #fff;
      font-size: 16px;
      font-weight: 650;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(99, 72, 220, 0.25);
      transition: transform 0.2s, box-shadow 0.2s, filter 0.2s;
    }

    button:hover {
      transform: translateY(-2px);
      filter: brightness(1.12);
      box-shadow: 0 12px 30px rgba(99, 72, 220, 0.4);
    }

    button:active {
      transform: translateY(0);
    }

    button:focus-visible {
      outline: 2px solid #c4b5fd;
      outline-offset: 4px;
    }

    #message {
      margin-top: 18px;
      color: #c4b5fd;
      font-size: 14px;
      line-height: 1.5;
    }

    .signup {
      margin-top: 26px;
      color: #b8c0d9;
      font-size: 13px;
      line-height: 1.7;
    }

    .footer {
      margin-top: 28px;
      color: #7f89a7;
      font-size: 11px;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(18px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 480px) {
      .login-box {
        padding: 34px 24px;
        border-radius: 20px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

<body>
  <main class="login-box" id="home">
    <div class="logo" aria-hidden="true">PP</div>

    <h1>Prashank Pandey</h1>
    <p class="subtitle">Welcome back! Please log in to continue.</p>

    <form id="loginForm">
      <div class="field">
        <label for="email">Email address</label>
        <input
          type="email"
          id="email"
          name="email"
          placeholder="you@example.com"
          autocomplete="username"
          required
        >
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          name="password"
          placeholder="Enter your password"
          autocomplete="current-password"
          required
        >
      </div>

      <div class="options">
        <label class="remember">
          <input type="checkbox" id="remember">
          Remember me
        </label>

        <a href="#help" id="helpLink">Need help?</a>
      </div>

      <button type="submit">Log In</button>

      <p id="message" role="status" aria-live="polite"></p>
    </form>

    <div class="signup">
      Welcome to the website of
      <a href="#home">Prashank Pandey</a>.
    </div>

    <div class="footer">
      &copy; <span id="year"></span> Prashank Pandey
    </div>
  </main>

  <script>
    const loginForm = document.getElementById("loginForm");
    const message = document.getElementById("message");

    document.getElementById("year").textContent =
      new Date().getFullYear();

    loginForm.addEventListener("submit", function (event) {
      event.preventDefault();

      // Demonstration only: no credentials are sent or stored.
      message.textContent =
        "Welcome to Prashank Pandey's website!";

      loginForm.reset();
    });

    document.getElementById("helpLink").addEventListener("click", function (event) {
      event.preventDefault();
      message.textContent =
        "This is a demo login page. Authentication is not configured.";
    });
  </script>
</body>
</html>
