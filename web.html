
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prashant Pandey | Login</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #e0e7ff, #f5f3ff);
    }

    .login-box {
      width: 90%;
      max-width: 380px;
      padding: 35px;
      border-radius: 16px;
      background: white;
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.12);
      text-align: center;
    }

    h1 {
      margin: 0 0 10px;
      color: #4338ca;
      font-size: 26px;
    }

    p {
      color: #666;
      margin-bottom: 25px;
    }

    input {
      display: block;
      width: 100%;
      padding: 13px;
      margin: 14px 0;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 15px;
    }

    button {
      width: 100%;
      padding: 13px;
      margin-top: 10px;
      border: none;
      border-radius: 8px;
      background: #4338ca;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #3730a3;
    }

    #message {
      margin-top: 20px;
      color: #4338ca;
      font-weight: bold;
    }
  </style>
</head>

<body>
  <main class="login-box">
    <h1>Prashant Pandey</h1>
    <p>Welcome! Please log in.</p>

    <form id="loginForm">
      <input
        type="email"
        placeholder="Email address"
        aria-label="Email address"
        required
      >

      <input
        type="password"
        placeholder="Password"
        aria-label="Password"
        required
      >

      <button type="submit">Log In</button>
    </form>

    <div id="message" role="status"></div>
  </main>

  <script>
    document.getElementById("loginForm").addEventListener("submit", function(event) {
      event.preventDefault();
      document.getElementById("message").textContent =
        "Welcome to Prashant Pandey's website!";
    });
  </script>
</body>
</html>
